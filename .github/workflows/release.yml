name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx vsce package --out vscode-tompei.vsix --allow-missing-repository

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          body: |
            ## インストール方法

            ターミナルから以下のコマンドを実行すると、常に最新版をインストールできます（初回・アップデート共通）：

            ```bash
            curl -L -o /tmp/vscode-tompei.vsix https://github.com/Tompedia-Labo/vscode-tompei/releases/latest/download/vscode-tompei.vsix && code --install-extension /tmp/vscode-tompei.vsix && rm /tmp/vscode-tompei.vsix
            ```

            または、下の `vscode-tompei.vsix` をダウンロードして：

            1. VS Code を開く
            2. 拡張機能タブの `...` →「VSIXからインストール...」を選択
            3. ダウンロードしたファイルを選択
